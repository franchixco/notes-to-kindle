name: Build plugin

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v6

            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun ci

            - name: Typecheck tests
              run: bun run test:typecheck

            - name: Test
              run: bun test

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build
