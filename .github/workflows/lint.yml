name: Build plugin

on:
    workflow_dispatch:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Use Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun ci

            - name: Typecheck tests
              run: bun run test:typecheck

            - name: Test
              run: bun test

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build

            - name: Verify generated bundle policy
              run: bun run check:bundle
