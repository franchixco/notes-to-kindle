name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v6

            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun ci

            - name: Typecheck tests
              run: bun run test:typecheck

            - name: Test
              run: bun test

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build

            - name: Verify tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest_version="$(bun -e 'const m = await Bun.file("manifest.json").json(); process.stdout.write(m.version)')"
                  if [ "$tag" != "$manifest_version" ]; then
                      echo "error: git tag '$tag' does not match manifest.json version '$manifest_version'" >&2
                      exit 1
                  fi
                  echo "Tag '$tag' matches manifest.json version '$manifest_version'."

            - name: Check for optional non-empty styles
              id: styles
              run: |
                  if [ -s styles.css ]; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      LICENSE
                      THIRD_PARTY_NOTICES.md
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json LICENSE THIRD_PARTY_NOTICES.md \
                    ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
